name: Feature Request
<!---
name: 功能请求
about: Suggest an idea for this project
-->

description: Suggest an idea for this project
title: '[Feature] '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
        
        感谢您花时间提出功能建议！

  - type: textarea
    id: problem
    attributes:
      label: Problem Description | 问题描述
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution | 建议方案
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives | 替代方案
      description: Describe alternatives you've considered
      placeholder: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context | 其他上下文
      description: Add any other context or screenshots about the feature request
      placeholder: Add any other context here

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation | 确认
      options:
        - label: I have searched existing issues | 我已搜索现有的 issues
          required: true
        - label: This feature is not already implemented | 该功能尚未实现
          required: true
